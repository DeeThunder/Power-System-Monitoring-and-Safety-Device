[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Library dependencies
lib_deps = 
    blynkkk/Blynk@^1.3.2
    olikraus/U8g2 @ ^2.35.19

; Build flags
build_flags = 
    -D SIMULATION_MODE        ; Enable potentiometer simulation (remove for production)
    -D CORE_DEBUG_LEVEL=3     ; ESP32 debug level
    -D APP_DEBUG              ; Enable application serial debugging output


; Upload settings
upload_speed = 921600
